# Netlify deploy configuration
# Build system: pnpm 11 (pinned), Node 22, static output in dist/

[build]
  command = "node scripts/fetch-apk.mjs && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.17.0"

# Astro hashes every asset file name — cache them forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The self-hosted APK: force download semantics + correct MIME so mobile
# browsers save the file instead of trying to navigate to it.
# Content-Encoding: identity is the important one — Netlify's CDN otherwise
# brotli-compresses the APK and drops Content-Length (chunked), so Chrome
# shows "?" instead of the real file size.
[[headers]]
  for = "/BreakFree.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=BreakFree.apk"
    Content-Encoding = "identity"

# Sensible hardening for a fully static, tracking-free site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
