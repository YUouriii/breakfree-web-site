# ─────────────────────────────────────────────────────────────────────────
# HOW TO USE THIS FILE
#
# 1. Copy this file into the taafi-app repository as:
#       .github/workflows/build-apk.yml
#
# 2. Add ONE repository secret:
#       Settings → Secrets and variables → Actions → New repository secret
#       Name:  GOOGLE_SERVICES_JSON
#       Value: the full contents of app/google-services.json
#    (that file is gitignored in the app repo, so CI needs it as a secret)
#
# 3. Publish a release: either push a tag (v1.0.0) or run the workflow
#    manually from the Actions tab. The APK is attached to the release as
#    "BreakFree.apk" — exactly the filename the website's download button
#    points to:
#
#    https://github.com/YUouriii/taafi-app/releases/latest/download/BreakFree.apk
#
# NOTE ON SIGNING: CI builds a debug-signed APK (installable, side-loadable).
# Google Sign-In / App Check validate the signing key's SHA-1, and a fresh CI
# keystore differs from your local one — enable the "Restore debug keystore"
# step below (with a DEBUG_KEYSTORE_B64 secret) so every build is signed with
# the same key, or configure a real release keystore before Play release.
# ─────────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional but recommended: same signing key on every CI build.
      # Store your debug keystore base64-encoded as DEBUG_KEYSTORE_B64:
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))
      # - name: Restore debug keystore
      #   env:
      #     DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      #   run: |
      #     mkdir -p ~/.android
      #     echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Restore the release upload key so every CI build is signed with the
      # SAME certificate as the local/Play builds. Without this the APK is
      # debug-signed: users cannot upgrade over an existing install and
      # Google Sign-In / App Check reject the app (SHA-1 mismatch).
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "No RELEASE_KEYSTORE_B64 secret - building without it."
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p out
          if [ -f my-upload-key.jks ]; then
            # Signed with the real upload key. If this fails we stop, rather
            # than publishing a debug-signed APK that users cannot upgrade to.
            ./gradlew :app:assembleRelease --stacktrace
            APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
            if [ -z "$APK" ]; then
              echo "Release build produced no APK - aborting." >&2
              exit 1
            fi
          else
            # No keystore secret configured: fall back to a debug build.
            ./gradlew :app:assembleDebug --stacktrace
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          cp "$APK" out/BreakFree.apk
          ls -lh out/BreakFree.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/BreakFree.apk
          generate_release_notes: true

      # Tell the website to rebuild so it picks up this release: the site
      # fetches the latest APK and shows the new version number. Create the
      # hook in Netlify (Site configuration -> Build & deploy -> Build hooks)
      # and store its URL here as the NETLIFY_BUILD_HOOK secret.
      - name: Rebuild the website
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -sS -X POST "$NETLIFY_BUILD_HOOK" -o /dev/null \
              -w "Website rebuild requested (HTTP %{http_code})\n"
          else
            echo "NETLIFY_BUILD_HOOK is not set - skipping the website rebuild."
          fi
